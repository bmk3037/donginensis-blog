<!doctype html>
<!--
  08편 「고속도로 터널은 낮에 불을 더 세게 켭니다」 합성 장면. 새 편은 이 파일을 작업 폴더에 복사해 고친다.
  편마다 고칠 곳(나머지 함수는 그대로 쓰는 도구 상자):
    1. <title>
    2. NAMES: 이미지 장수(length)
    3. SCENES: [이미지 번호, 시작, 끝, 카메라, 그림 위 그래픽(이미지 좌표), 화면 위 그래픽(화면 좌표)]
       시각은 A(i)/B(i)=i번 문장 구간, cm(i,k)=i번 문장 k번째 쉼표, at(i,0.5)=문장 중간.
    4. KEYS: 자막에서 노랗게 칠할 핵심어
  지켜야 할 것: 컷 안에서 다시 자르지 않기(cuts 1), 순간 확대·흐림 없음, 흔들림은 가장 센 순간 0.5초만.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>08 터널 조명</title>
<style>
  @font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-Bold.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-ExtraBold.woff2") format("woff2"); font-weight: 800; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #1c1f22; }
  #stage { position: absolute; inset: 0; }
  /* 건축사전처럼 화면 가운데 아래쪽, 흰 글자에 검은 테두리 */
  #sub {
    position: absolute; left: 60px; right: 60px; top: 1175px;
    font-family: "Pretendard", sans-serif; font-weight: 800; font-size: 60px; line-height: 1.25;
    color: #fff; text-align: center; word-break: keep-all;
    -webkit-text-stroke: 9px #000; paint-order: stroke fill;
    text-shadow: 0 4px 14px rgba(0,0,0,.55);
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="sub"></div>
<script src="timeline.js"></script>
<script>
const RED = "#E5392B";
const L = TL.lines;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const out = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const FONT = `font-family="Pretendard" font-weight="800"`;
const at = (i, f) => L[i].start + (L[i].end - L[i].start) * f;
const cm = (i, k = 0) => L[i].commas[k];

// 이미지 크기는 불러와서 잰다. 아직 없는 이미지는 자리 표시만 한다
const NAMES = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
const CLIPS = {}, CLIPIMG = {};
const SIZE = {}, MISSING = new Set();
const loadImg = n => new Promise(r => {
  const im = new Image();
  im.onload = () => { SIZE[n] = [im.naturalWidth, im.naturalHeight]; r(); };
  im.onerror = () => { SIZE[n] = [948, 1659]; MISSING.add(n); r(); };
  im.src = `img/${n}.webp`;
});
const loadFrame = src => new Promise(r => {
  const im = new Image();
  im.onload = () => (im.decode ? im.decode() : Promise.resolve()).then(r, r); im.onerror = r; im.src = src; CLIPIMG[src] = im;
});
const FRAMES = Object.entries(CLIPS).flatMap(([c, n]) => Array.from({ length: n }, (_, k) => `clip/${c}/${String(k + 1).padStart(3, "0")}.jpg`));
// 작업 폴더에 cover.png(make.sh cover)가 있으면 첫 1초를 커버 화면으로 쓴다
const HASCOVER = { v: false };
const loadCover = () => new Promise(r => { const im = new Image(); im.onload = () => { HASCOVER.v = true; r(); }; im.onerror = r; im.src = "cover.png"; });
window.READY = Promise.all([...NAMES.map(loadImg), ...FRAMES.map(loadFrame), loadCover()]).then(() => window.setTime(0));

// 이미지를 화면에 꽉 채우고, 카메라(확대·이동)와 컷 순간의 펀치를 준다. 그래픽은 이미지 픽셀 좌표로 적는다
function photo(name, t, a, b, cam, overlay = "") {
  const clip = cam.clip;
  const [w, h] = clip ? [720, 1280] : SIZE[name];
  const K = Math.max(1080 / w, 1920 / h), ox = (1080 - w * K) / 2, oy = (1920 - h * K) / 2;
  const p = ease(prog(t, a, b));
  // 건축사전처럼 2~3초마다 컷: 같은 그림을 넓게 → 가까이 → 다른 쪽으로 잘라 쓴다
  const n = cam.cuts || 1, len = (b - a) / n;
  const k = clamp(Math.floor((t - a) / len), 0, n - 1), t0 = a + k * len;
  const Z = [1, 1.2, 1.08, 1.28][k % 4], DX = [0, -50, 45, 0][k % 4], DY = [0, 35, -30, 10][k % 4];
  const punch = 1;
  const s = lerp(cam.from || 1, cam.to || 1.1, p) * Z * punch;
  const dx = lerp(cam.dx0 || 0, cam.dx1 || 0, p) + DX, dy = lerp(cam.dy0 || 0, cam.dy1 || 0, p) + DY;
  const blur = "";
  const cx = cam.cx || 540, cy = cam.cy || 900;
  const shake = cam.shake ? cam.shake(t) : [0, 0];
  const fi = clip ? Math.max(1, Math.min(CLIPS[clip.id], Math.floor((clip.from || 1) + (t - a) * 30 * (clip.rate || 1)))) : 0;
  const rv = cam.reveal;
  if (rv && !MISSING.has(name)) {
    const p2 = out(prog(t, rv.t0, rv.t0 + (rv.dur || 1.4))), id = "rv" + name + Math.round(a * 100);
    const shape = rv.mode === "down" ? `<rect x="-20" y="-20" width="${w + 40}" height="${(h + 40) * p2}" fill="#fff"/>`
      : `<circle cx="${rv.x}" cy="${rv.y}" r="${Math.hypot(w, h) * p2}" fill="#fff"/>`;
    const inner = `<image href="img/${rv.bg}.webp" width="${w}" height="${h}"/><mask id="${id}">${shape}</mask><image href="img/${name}.webp" width="${w}" height="${h}" mask="url(#${id})"/>`;
    return `<g transform="translate(${dx + shake[0]},${dy + shake[1]}) translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})">
    <g transform="translate(${ox},${oy}) scale(${K})">${inner}${overlay}</g></g>`;
  }
  const img = clip ? `<image href="clip/${clip.id}/${String(fi).padStart(3, "0")}.jpg" width="720" height="1280"/>` : MISSING.has(name)
    ? `<rect width="${w}" height="${h}" fill="#3a3f45"/><text x="${w / 2}" y="${h / 2}" text-anchor="middle" ${FONT} font-size="80" fill="#9aa">${name} 이미지 대기</text>`
    : `<image href="img/${name}.webp" width="${w}" height="${h}"/>`;
  return `<g${blur} transform="translate(${dx + shake[0]},${dy + shake[1]}) translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})">
    <g transform="translate(${ox},${oy}) scale(${K})">${img}${overlay}</g></g>`;
}
// 그림에 그려진 빈 붉은 라벨 상자에 한글을 채운다
function fillBox(t, t0, x, y, w, h, text, size) {
  if (t < t0) return "";
  const p = back(prog(t, t0, t0 + 0.4)), fs = size || h * 0.66;
  return `<g transform="translate(${x + w / 2},${y + h / 2}) scale(${p}) translate(${-x - w / 2},${-y - h / 2})">
    <rect x="${x - 2}" y="${y - 2}" width="${w + 4}" height="${h + 4}" rx="4" fill="${RED}"/>
    <text x="${x + w / 2}" y="${y + h / 2 + fs * 0.36}" text-anchor="middle" ${FONT} font-size="${fs}" fill="#fff">${text}</text></g>`;
}
// 우리가 새로 다는 붉은 라벨
function tag(t, t0, x, y, text, size = 46, anchor = "start") {
  if (t < t0) return "";
  const p = back(prog(t, t0, t0 + 0.4)), w = text.length * size * 0.98 + size * 0.9, h = size * 1.5;
  const x0 = anchor === "end" ? x - w : anchor === "middle" ? x - w / 2 : x;
  return `<g transform="translate(${x0 + w / 2},${y}) scale(${p}) translate(${-x0 - w / 2},${-y})" opacity="${prog(t, t0, t0 + 0.12)}">
    <rect x="${x0}" y="${y - h / 2}" width="${w}" height="${h}" rx="6" fill="${RED}"/>
    <text x="${x0 + w / 2}" y="${y + size * 0.36}" text-anchor="middle" ${FONT} font-size="${size}" fill="#fff">${text}</text></g>`;
}
// 큰 숫자(흰 글자, 검은 테두리)
function big(t, t0, x, y, text, size = 150, color = "#fff", anchor = "start") {
  if (t < t0) return "";
  const p = back(prog(t, t0, t0 + 0.45));
  return `<g transform="translate(${x},${y}) scale(${p}) translate(${-x},${-y})" opacity="${prog(t, t0, t0 + 0.12)}">
    <text x="${x}" y="${y}" text-anchor="${anchor}" ${FONT} font-size="${size}" fill="${color}" stroke="#000" stroke-width="${size / 12}" paint-order="stroke" stroke-linejoin="round">${text}</text></g>`;
}
function rings(t, t0, x, y, r = 40, n = 2) {
  if (t < t0) return "";
  let s = "";
  for (let k = 0; k < n; k++) {
    const ph = ((t - t0) * 0.9 + k / n) % 1;
    s += `<circle cx="${x}" cy="${y}" r="${r * (0.4 + 1.6 * ph)}" fill="none" stroke="${RED}" stroke-width="5" opacity="${(1 - ph) * prog(t, t0, t0 + 0.2)}"/>`;
  }
  return s;
}
function heat(t, t0, x, y, r) {
  if (t < t0) return "";
  const g = 0.45 + 0.3 * Math.sin((t - t0) * 7);
  return `<radialGradient id="h${x}${y}"><stop offset="0" stop-color="${RED}" stop-opacity="${g * prog(t, t0, t0 + 0.5)}"/><stop offset="1" stop-color="${RED}" stop-opacity="0"/></radialGradient>
    <circle cx="${x}" cy="${y}" r="${r}" fill="url(#h${x}${y})"/>`;
}
// 상자가 '듣는' 표시: 상자 쪽으로 좁아지는 호
function listen(t, t0, x, y, dir = 1) {
  if (t < t0) return "";
  let s = "";
  for (let k = 0; k < 3; k++) {
    const ph = ((t - t0) * 0.8 + k / 3) % 1, r = 160 - 120 * ph;
    s += `<path d="M ${x + dir * r * 0.55} ${y - r} A ${r} ${r} 0 0 ${dir > 0 ? 1 : 0} ${x + dir * r * 0.55} ${y + r}" fill="none" stroke="${RED}" stroke-width="9" stroke-linecap="round" opacity="${Math.sin(ph * Math.PI)}"/>`;
  }
  return s;
}
// 09: 제어반 화면 안 그래프(화면의 기울기에 맞춰 붙인다)
function screen(t, t0, tWarn) {
  if (t < t0) return "";
  const W = 300, H = 200, p = prog(t, t0, tWarn + 0.6);
  const lines = [
    { c: "#59C3FF", f: x => 120 - 18 * Math.sin(x * 9) - 6 * Math.sin(x * 23), k: "전류" },
    { c: "#F2C14E", f: x => 150 - 10 * Math.sin(x * 7 + 1), k: "떨림" },
    { c: RED, f: x => 165 - 25 * x - 105 * Math.pow(Math.max(0, x - 0.6) / 0.4, 2), k: "온도" },
  ];
  let s = `<g transform="matrix(${257 / W},${65 / W},${-1 / H},${258 / H},598,392)">
    <rect width="${W}" height="${H}" fill="#0d1620"/>
    <line x1="8" y1="62" x2="${W - 8}" y2="62" stroke="#fff" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/>
    <text x="${W - 10}" y="54" text-anchor="end" ${FONT} font-size="15" fill="#fff" opacity=".85">기준</text>`;
  for (const ln of lines) {
    let d = "";
    for (let i = 0; i <= 60 * p; i++) { const x = i / 60; d += `${i ? "L" : "M"}${10 + x * (W - 20)} ${ln.f(x)} `; }
    s += `<path d="${d}" fill="none" stroke="${ln.c}" stroke-width="4" stroke-linejoin="round"/>`;
  }
  s += `<text x="12" y="${H - 10}" ${FONT} font-size="15" fill="#59C3FF">전류</text>
    <text x="62" y="${H - 10}" ${FONT} font-size="15" fill="#F2C14E">떨림</text>
    <text x="112" y="${H - 10}" ${FONT} font-size="15" fill="${RED}">온도</text>`;
  if (t > tWarn) {
    const blink = Math.sin((t - tWarn) * 14) > -0.2 ? 1 : 0.25;
    s += `<rect width="${W}" height="${H}" fill="none" stroke="${RED}" stroke-width="8" opacity="${blink}"/>
      <g opacity="${blink}"><rect x="${W / 2 - 50}" y="12" width="100" height="34" rx="5" fill="${RED}"/>
      <text x="${W / 2}" y="37" text-anchor="middle" ${FONT} font-size="22" fill="#fff">경고</text></g>`;
  }
  return s + "</g>";
}
// 11: 온도계와 수명 막대
function thermo(t, t0, tLife) {
  if (t < t0) return "";
  const x = 120, y0 = 330, y1 = 1000, o = prog(t, t0, t0 + 0.3);
  const lvl = lerp(0.45, 0.8, out(prog(t, t0 + 0.2, t0 + 1.4)));
  const life = lerp(1, 0.5, out(prog(t, tLife, tLife + 1.0)));
  return `<g opacity="${o}">
    <rect x="${x - 34}" y="${y0}" width="68" height="${y1 - y0}" rx="34" fill="#fff" stroke="#222" stroke-width="6"/>
    <circle cx="${x}" cy="${y1 + 30}" r="62" fill="${RED}" stroke="#222" stroke-width="6"/>
    <rect x="${x - 20}" y="${y1 - (y1 - y0 - 20) * lvl}" width="40" height="${(y1 - y0 - 20) * lvl + 30}" fill="${RED}"/>
    <line x1="${x + 40}" y1="${y1 - (y1 - y0 - 20) * 0.45}" x2="${x + 80}" y2="${y1 - (y1 - y0 - 20) * 0.45}" stroke="#fff" stroke-width="6"/>
    <line x1="${x + 40}" y1="${y1 - (y1 - y0 - 20) * 0.8}" x2="${x + 80}" y2="${y1 - (y1 - y0 - 20) * 0.8}" stroke="#fff" stroke-width="6"/>
  </g>
  ${big(t, t0 + 0.9, x + 100, y1 - (y1 - y0 - 20) * 0.8 + 30, "+10℃", 96, "#fff")}
  ${t > tLife ? `<g opacity="${prog(t, tLife, tLife + 0.2)}">
    <text x="${x - 40}" y="1220" ${FONT} font-size="54" fill="#fff" stroke="#000" stroke-width="6" paint-order="stroke">수명</text>
    <rect x="${x - 40}" y="1245" width="420" height="56" rx="8" fill="#000" opacity=".45"/>
    <rect x="${x - 40}" y="1245" width="${420 * life}" height="56" rx="8" fill="${RED}"/>
    ${life < 0.55 ? `<text x="${x + 400}" y="1290" ${FONT} font-size="60" fill="#fff" stroke="#000" stroke-width="6" paint-order="stroke">½</text>` : ""}</g>` : ""}`;
}

// 그림에 없는 붉은 외곽선을 직접 그린다(대체 장면용)
function poly(t, t0, pts) {
  if (t < t0) return "";
  const p = out(prog(t, t0, t0 + 0.7)), glow = 0.75 + 0.25 * Math.sin((t - t0) * 6);
  const d = "M" + pts.map(q => q.join(" ")).join(" L") + " Z";
  return `<path d="${d}" fill="${RED}" fill-opacity="${0.1 * p}" stroke="${RED}" stroke-width="12" stroke-linejoin="round" opacity="${0.35 * p * glow}" filter="blur(6px)"/>
    <path d="${d}" fill="none" stroke="#ff5a4a" stroke-width="5" stroke-linejoin="round" pathLength="100" stroke-dasharray="${100 * p} 100" opacity="${glow}"/>`;
}
function donut(t, t0, cx, cy, r, pct, label) {
  if (t < t0) return "";
  const p = out(prog(t, t0, t0 + 1.0)), v = pct * p, a = -Math.PI / 2 + 2 * Math.PI * v / 100;
  const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
  return `<g opacity="${prog(t, t0, t0 + 0.2)}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="80"/>
    <path d="M ${cx} ${cy - r} A ${r} ${r} 0 ${v > 50 ? 1 : 0} 1 ${x} ${y}" fill="none" stroke="${RED}" stroke-width="80"/>
    <text x="${cx}" y="${cy + 50}" text-anchor="middle" ${FONT} font-size="150" fill="#fff" stroke="#000" stroke-width="10" paint-order="stroke">${Math.round(v)}%</text>
    <text x="${cx}" y="${cy + 130}" text-anchor="middle" ${FONT} font-size="56" fill="#fff" stroke="#000" stroke-width="6" paint-order="stroke">${label}</text></g>`;
}

// 점선을 따라 상자 쪽으로 흐르는 데이터 점
function flow(t, t0, pts, color = "#ff6a5a") {
  if (t < t0) return "";
  const seg = [], tot = [0];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot.push(tot[i - 1] + d); }
  const L = tot[tot.length - 1], o = prog(t, t0, t0 + 0.3);
  let s = "";
  for (let j = 0; j < 4; j++) {
    const u = (((t - t0) * 0.55 + j / 4) % 1) * L;
    let i = 0; while (i < seg.length - 1 && tot[i + 1] < u) i++;
    const f = (u - tot[i]) / seg[i], x = lerp(pts[i][0], pts[i + 1][0], f), y = lerp(pts[i][1], pts[i + 1][1], f);
    s += `<circle cx="${x}" cy="${y}" r="16" fill="${color}" opacity="${0.35 * o}"/><circle cx="${x}" cy="${y}" r="8" fill="#fff" opacity="${o}"/>`;
  }
  return s;
}
// 붉은 점선 경로가 그려진다(순찰 동선)
function route(t, t0, pts, id, dur = 1.6) {
  if (t < t0) return "";
  const d = "M" + pts.map(q => q.join(" ")).join(" L"), p = out(prog(t, t0, t0 + dur));
  return `<mask id="${id}"><path d="${d}" fill="none" stroke="#fff" stroke-width="40" pathLength="1" stroke-dasharray="${p} 1"/></mask>
    <path d="${d}" fill="none" stroke="${RED}" stroke-width="12" stroke-dasharray="1 20" stroke-linecap="round" mask="url(#${id})"/>`;
}
// 건축사전식 붉은 화살표 세 개가 한 점으로 모인다
function arrows(t, t0, x, y, r = 300) {
  if (t < t0) return "";
  let s = "";
  [-38, 0, 38].forEach((ang, k) => {
    const p = back(prog(t, t0 + 0.08 * k, t0 + 0.08 * k + 0.45)), a = (ang - 90) * Math.PI / 180;
    const d = r * (1.6 - 0.6 * p), x1 = x + Math.cos(a) * d, y1 = y + Math.sin(a) * d, x2 = x + Math.cos(a) * r * 0.42, y2 = y + Math.sin(a) * r * 0.42;
    const hx = Math.cos(a), hy = Math.sin(a), nx = -hy, ny = hx;
    s += `<g opacity="${prog(t, t0 + 0.08 * k, t0 + 0.08 * k + 0.15)}"><line x1="${x1}" y1="${y1}" x2="${x2 + hx * 40}" y2="${y2 + hy * 40}" stroke="${RED}" stroke-width="26" stroke-linecap="round"/>
      <polygon points="${x2},${y2} ${x2 + hx * 70 + nx * 40},${y2 + hy * 70 + ny * 40} ${x2 + hx * 70 - nx * 40},${y2 + hy * 70 - ny * 40}" fill="${RED}"/></g>`;
  });
  return s;
}
// 하루 24시간 원형 게이지
function clock24(t, t0, x, y, r = 120) {
  if (t < t0) return "";
  const p = prog(t, t0, t0 + 1.6), a = -Math.PI / 2 + 2 * Math.PI * p * 0.999;
  return `<g opacity="${prog(t, t0, t0 + 0.2)}"><circle cx="${x}" cy="${y}" r="${r}" fill="#0b121b" fill-opacity=".72" stroke="#fff" stroke-opacity=".3" stroke-width="22"/>
    <path d="M ${x} ${y - r} A ${r} ${r} 0 ${p > 0.5 ? 1 : 0} 1 ${x + r * Math.cos(a)} ${y + r * Math.sin(a)}" fill="none" stroke="${RED}" stroke-width="22" stroke-linecap="round"/>
    <text x="${x}" y="${y + 18}" text-anchor="middle" ${FONT} font-size="64" fill="#fff">${Math.round(24 * p)}시간</text></g>`;
}
// 떨어지는 핀 + 라벨
function pinDrop(t, t0, x, y, label) {
  if (t < t0) return "";
  const d = back(prog(t, t0, t0 + 0.5)), ring = ((t - t0) * 0.9) % 1;
  return `<g transform="translate(0,${-180 * (1 - d)})" opacity="${prog(t, t0, t0 + 0.12)}">
    <circle cx="${x}" cy="${y}" r="${14 + 50 * ring}" fill="none" stroke="${RED}" stroke-width="4" opacity="${1 - ring}"/>
    <path d="M${x} ${y} C ${x - 30} ${y - 44}, ${x - 30} ${y - 86}, ${x} ${y - 86} C ${x + 30} ${y - 86}, ${x + 30} ${y - 44}, ${x} ${y} Z" fill="${RED}" stroke="#fff" stroke-width="4"/>
    <circle cx="${x}" cy="${y - 58}" r="11" fill="#fff"/></g>${tag(t, t0 + 0.3, x + 36, y - 120, label, 38)}`;
}
// 심장박동 선(마지막 장면)
function ecg(t, t0, y = 760) {
  if (t < t0) return "";
  const p = prog(t, t0, t0 + 2.2), W = 1080;
  let d = "", N = 200;
  for (let i = 0; i <= N * p; i++) {
    const x = i / N * W, u = (x % 270) / 270;

// 회전 화살표(베어링이 돈다)

// 30: 상자 화면 안의 심장박동 선

// 05: 건물 옆에 10미터마다 붉은 치수 눈금이 쌓이고 기압이 하나씩 오른다

  ["15", A(21), B(21), { from: 1.0, to: 1.1, cx: 540, cy: 900 }, null, t => tag(t, L[21].start + 0.2, 540, 330, "숫자로 재고", 64, "middle") + tag(t, cm(21) + 0.1, 540, 460, "→ 숫자에 맞춰 움직이고", 56, "middle")],
  ["16", A(22), B(22), { from: 1.0, to: 1.1, cx: 540, cy: 900 }, null, t => tag(t, L[22].start + 0.2, 540, 330, "공장 설비도 같은 원리", 60, "middle")],
  ["08", A(23), B(23), { from: 1.0, to: 1.2, cx: 560, cy: 900 }, null, t => tag(t, L[23].start + 0.3, 540, 330, "입구 쪽 불빛을 보세요", 60, "middle")],
  ["11", A(24), cm(24), { from: 1.0, to: 1.12, cx: 540, cy: 760, cuts: 1 }],
  ["07", cm(24), B(24), { from: 1.12, to: 1.0, cx: 638, cy: 900, cuts: 1 }],
];
const ALT = {};
const FADE = 0.12;
const alpha = (t, a, b) => Math.min(prog(t, a - FADE / 2, a + FADE / 2), 1 - prog(t, b - FADE / 2, b + FADE / 2));

// 자막은 건축사전처럼 짧게 끊는다: 쉼표에서 나누고, 15자를 넘으면 어절로 다시 나눈다
const CHUNKS = [];
for (const l of L) {
  const parts = l.text.split(/,\s*/), edges = [l.start, ...l.commas, l.end];
  parts.forEach((p, k) => {
    const words = p.split(" "), groups = [];
    for (const w of words) {
      const g = groups[groups.length - 1];
      if (g && (g + " " + w).length <= 15) groups[groups.length - 1] = g + " " + w; else groups.push(w);
    }
    const a = edges[k], b = edges[k + 1], tot = groups.reduce((s, g) => s + g.length, 0);
    let c = a;
    for (const g of groups) { const d = (b - a) * g.length / tot; CHUNKS.push([c, c + d, g + (k < parts.length - 1 && g === groups[groups.length - 1] ? "," : "")]); c += d; }
  });
}
const KEYS = ["대낮", "낮", "블랙홀", "화이트홀", "입구만", "46억 원", "2천 개", "28미터", "센서", "숫자"];
function subtitle(t) {
  for (const [a, b, s] of CHUNKS) if (t >= a - 0.05 && t < b + 0.05) {
    let h = s.replace(/[.,]$/, "");
    for (const k of KEYS) if (h.includes(k)) { h = h.replace(k, `<span style="color:#FFD43B">${k}</span>`); break; }
    return h;
  }
  return "";
}
window.setTime = function (t) {
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#1c1f22"/><filter id="whip" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14 3"/></filter>`;
  SCENES.forEach(sc => {
    const [name, a, b, cam, ov, hud] = sc;
    const al = alpha(t, a, b);
    if (al > 0.001) svg += `<g opacity="${al}">${photo(name, t, a, b, cam, ov ? ov(t) : "")}${hud ? hud(t) : ""}</g>`;
  });
  // 첫 1초는 커버(섬네일) 화면: 피드·격자에서 첫 프레임이 곧 커버가 된다
  if (HASCOVER.v && t < 1.15) svg += `<image href="cover.png" width="1080" height="1920" opacity="${1 - prog(t, 0.9, 1.15)}"/>`;
  const end = 0;
  svg += `<rect width="1080" height="1920" fill="#000" opacity="${end}"/></svg>`;
  document.getElementById("stage").innerHTML = svg;
  document.getElementById("sub").innerHTML = HASCOVER.v && t < 1.15 ? "" : subtitle(t);
};
</script>
